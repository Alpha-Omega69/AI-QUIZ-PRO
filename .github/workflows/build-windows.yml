name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Electron deps
        working-directory: quiz/electron
        run: npm install

      - name: Build .exe
        working-directory: quiz/electron
        run: npm run dist

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Quiz-Pro-Windows
          path: quiz/electron/dist/*.exe
