name: Build Android APK

# Builds a real, downloadable, installable Android app (.apk) automatically —
# no Android Studio needed on your machine. Runs on GitHub's free cloud runners.
# Trigger it manually from the "Actions" tab (Run workflow), or it runs
# automatically on every push to main.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Quiz-Pro-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
